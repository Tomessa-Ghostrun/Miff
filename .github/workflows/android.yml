name: android

# Android build, lint, format and unit tests (ticket INIT, section 4.E).
# Never use pull_request_target here: this workflow reads a repository secret.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Début du chronomètre
        # Avant le checkout, `android/` n'existe pas encore : on s'exécute à la racine de l'espace de travail.
        working-directory: .
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # gradle/actions wrapper-validation v6.4.0 (commit of the annotated tag, checked with the GitHub API). Checks that
      # android/gradle/wrapper/gradle-wrapper.jar is an official Gradle one (checksum list published by Gradle), BEFORE
      # any ./gradlew run: a tampered wrapper jar would run with access to the Firebase configuration of this job.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c

      # actions/setup-java v6.1.0. JDK 17 is the minimum required by Android Gradle Plugin 9.4.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper and timing file
        run: |
          chmod +x gradlew
          printf '| Step | Seconds |\n|---|---|\n' > "$RUNNER_TEMP/timings.md"

      - name: Decode Firebase configuration (secret, never printed)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set +x
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ] && [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
            # Dependabot PRs cannot read repository secrets. Generate an OBVIOUSLY FAKE configuration, only so that the
            # project compiles. It points to no real project, can never be used, and the APK built from it is NOT uploaded.
            umask 077
            cat > app/google-services.json <<'FAKE'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fake-ci-config-do-not-use",
              "storage_bucket": "fake-ci-config-do-not-use.invalid"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.tomessa.miff" }
                },
                "api_key": [ { "current_key": "FAKE-CI-KEY-NOT-A-REAL-KEY-DO-NOT-USE" } ]
              }
            ],
            "configuration_version": "1"
          }
          FAKE
            echo "FAKE_FIREBASE_CONFIG=true" >> "$GITHUB_ENV"
            echo "Dependabot : configuration Firebase factice generee (secret indisponible pour Dependabot). Aucun APK ne sera publie."
            exit 0
          fi
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error title=Secret manquant::Le secret GitHub GOOGLE_SERVICES_JSON_B64 est absent. Le PM doit le creer (PowerShell) : [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"chemin\\google-services.json\")) | gh secret set GOOGLE_SERVICES_JSON_B64 --repo Tomessa-Ghostrun/Miff"
            echo "Secret GOOGLE_SERVICES_JSON_B64 absent : le PM doit le creer avec la commande indiquee dans l'annotation d'erreur ci-dessus." >&2
            exit 1
          fi
          umask 077
          if ! printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json 2>/dev/null; then
            rm -f app/google-services.json
            echo "::error title=Secret invalide::GOOGLE_SERVICES_JSON_B64 n'est pas du base64 valide. Le PM doit le recreer avec la commande de l'etape precedente."
            exit 1
          fi
          if ! grep -q '"project_id": *"miff-3d283"' app/google-services.json; then
            rm -f app/google-services.json
            echo "::error title=Mauvais projet Firebase::Le fichier decode ne correspond pas au projet miff-3d283. Le PM doit le regenerer avec : firebase apps:sdkconfig ANDROID <APP_ID> --project miff-3d283"
            exit 1
          fi
          # "Continuer avec Google" needs the OAuth WEB client (client_type 3): without it the button cannot work.
          if ! grep -q '"client_type": *3' app/google-services.json; then
            rm -f app/google-services.json
            echo "::error title=Client OAuth web absent::Le google-services.json du secret GOOGLE_SERVICES_JSON_B64 ne contient aucun client OAuth web (client_type 3), necessaire a la connexion Google. Le PM doit activer Google dans Firebase > Authentication, enregistrer la SHA-1 de debug dans Firebase, regenerer le fichier avec : firebase apps:sdkconfig ANDROID <APP_ID> --project miff-3d283, puis recreer le secret."
            exit 1
          fi

      # Stable debug signature (ticket AUTH-1): Google sign-in needs a FIXED SHA-1 registered in Firebase. The keystore
      # comes from a secret, is decoded into the default debug location of this disposable runner (AGP picks it up by
      # itself, alias androiddebugkey, standard debug passwords), is never printed, and is removed at the end of the job.
      # A debug key signs test APKs only, never anything that is published.
      # Without the secret (Dependabot, forks): the default throw-away debug key is kept.
      - name: Install stable debug keystore (secret, never printed)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set +x
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_USED=false" >> "$GITHUB_ENV"
            echo "::notice title=Signature de debug par defaut::Secret DEBUG_KEYSTORE_B64 absent : l'APK est signe avec une cle jetable (empreinte SHA-1 instable, connexion Google inutilisable avec cet APK)."
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.android"
          if ! printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore" 2>/dev/null; then
            rm -f "$HOME/.android/debug.keystore"
            echo "::error title=Secret invalide::DEBUG_KEYSTORE_B64 n'est pas du base64 valide. Le PM doit le recreer (voir android/README.md, section signature de debug)."
            exit 1
          fi
          echo "DEBUG_KEYSTORE_USED=true" >> "$GITHUB_ENV"

      - name: Format check (Spotless / ktlint)
        run: |
          start=$(date +%s)
          ./gradlew spotlessCheck --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| spotlessCheck | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      - name: Android Lint
        run: |
          start=$(date +%s)
          ./gradlew lintDebug --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| lintDebug | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      - name: Unit tests
        run: |
          start=$(date +%s)
          ./gradlew testDebugUnitTest --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| testDebugUnitTest | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      - name: Build debug APK
        run: |
          start=$(date +%s)
          ./gradlew assembleDebug --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| assembleDebug | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      # Release preparation (docs/release/checklist-android.md): the version is never frozen. Without -Pmiff.versionCode / -Pmiff.versionName (as here), the APK
      # carries the version of the first "## [x.y.z]" heading of android/CHANGELOG.md and the code major * 1 000 000 + minor * 1 000 + patch. Read back from the
      # real APK with aapt2, so that a change of the build file cannot silently bring back 1 / 0.1.0.
      - name: Check the version carried by the APK (changelog, not 1 / 0.1.0)
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          package_line=$("$aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -m1 '^package:')
          apk_name=$(printf '%s' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          apk_code=$(printf '%s' "$package_line" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          log_name=$(sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$log_name" ]; then
            echo "::error title=Changelog sans version::Aucun titre « ## [x.y.z] » dans android/CHANGELOG.md : la version de l'APK ne peut plus en etre derivee."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$log_name"
          expected_code=$(( major * 1000000 + minor * 1000 + patch ))
          if [ "$apk_name" != "$log_name" ] || [ "$apk_code" != "$expected_code" ]; then
            echo "::error title=Version de l'APK::L'APK porte la version $apk_name (code $apk_code) au lieu de $log_name (code $expected_code) : voir versionName et versionCode dans android/app/build.gradle.kts."
            exit 1
          fi
          if [ "$apk_code" = "1" ] || [ "$apk_name" = "0.1.0" ]; then
            echo "::error title=Version figee::L'APK porte la version figee 1 / 0.1.0."
            exit 1
          fi
          echo "L'APK porte la version $apk_name (code $apk_code), celle du changelog."

      # Proof that the APK carries the debug fingerprint registered in Firebase (a SHA-1 is public information).
      - name: Check the SHA-1 of the debug APK against the Firebase configuration
        if: env.DEBUG_KEYSTORE_USED == 'true' && env.FAKE_FIREBASE_CONFIG != 'true'
        run: |
          set +x
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk_sha1=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-1 digest: *//p' | head -1 | tr 'A-F' 'a-f')
          if [ -z "$apk_sha1" ]; then
            echo "::error title=Signature illisible::Impossible de lire l'empreinte de l'APK de debug."
            exit 1
          fi
          if grep -qi "\"certificate_hash\": *\"$apk_sha1\"" app/google-services.json; then
            echo "SHA-1 de l'APK de debug ($apk_sha1) : declaree dans la configuration Firebase."
          else
            echo "::error title=Empreinte non enregistree::L'APK de debug est signe avec la SHA-1 $apk_sha1, absente de google-services.json. Le PM doit l'ajouter dans Firebase > Parametres du projet > application Android, regenerer le fichier et recreer GOOGLE_SERVICES_JSON_B64."
            exit 1
          fi

      # "releaseLike" = the release build (R8, not debuggable, no diagnostic screen) signed with the DEBUG key, to compare the launch
      # time with the debug APK on a phone. Test build only: never published, short retention.
      - name: Build releaseLike APK (release code, signed with the debug key)
        run: |
          start=$(date +%s)
          ./gradlew assembleReleaseLike --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| assembleReleaseLike | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      - name: Build release bundle (unsigned)
        run: |
          start=$(date +%s)
          ./gradlew bundleRelease --console=plain -Pmiff.uploadCrashlyticsMapping=false
          printf '| bundleRelease (unsigned) | %s |\n' "$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/timings.md"

      - name: Check that the release bundle contains no debug-only code
        run: |
          # `grep -c` reads everything and a second grep reads the count: with `grep -q` straight after unzip, an early match makes unzip die of SIGPIPE and, under
          # pipefail, the test would wrongly say "not found" (a leak would go unnoticed).
          # The review window (docs/tickets/pop-ins-avis.md, AV2) is IN the debug APK (so its marker cannot silently disappear and make the checks below pass for nothing)
          # and ABSENT from every distributable build (release bundle and releaseLike, checked below).
          debug=app/build/outputs/apk/debug/app-debug.apk
          test -f "$debug" || { echo "::error::APK debug introuvable : $debug"; exit 1; }
          if ! unzip -p "$debug" 'classes*.dex' | grep -a -c 'REVIEWPROMPTPROBE' | grep -q -v '^0$'; then
            echo "::error title=Marqueur de la fenetre d'avis absent du debug::L'APK debug ne contient pas REVIEWPROMPTPROBE : la fenetre d'avis a disparu du debug ou son marqueur a change (ReviewPromptWindow.kt, ReviewPromptReleaseTest)."
            exit 1
          fi
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -f "$bundle" || { echo "::error::Bundle release introuvable : $bundle"; exit 1; }
          dex_count=$(unzip -Z1 "$bundle" | grep -c '^base/dex/.*\.dex$' || true)
          if [ "$dex_count" -lt 1 ]; then
            echo "::error::Aucun fichier dex dans le bundle release : verification impossible."
            exit 1
          fi
          if unzip -p "$bundle" 'base/dex/*.dex' | grep -a -c -E 'DIAGNOSTICPROBE|DebugAppCheck|DEBUGAPPCHECKOFF|DETECTIONJOURNAL|REVIEWPROMPTPROBE|DIAGNOSTICHOLDGESTURE' | grep -q -v '^0$'; then
            echo "::error title=Code de debug dans le release::Le bundle release contient DIAGNOSTICPROBE, DebugAppCheck, DEBUGAPPCHECKOFF (interrupteur « sans App Check », AC-4), DETECTIONJOURNAL, REVIEWPROMPTPROBE ou DIAGNOSTICHOLDGESTURE (geste secret d'appui de 10 s vers le diagnostic) : l'ecran de diagnostic, le fournisseur App Check de debug ou son interrupteur « sans App Check » (AC-4), le journal de detection (LOC-2b) ou la fenetre d'avis (docs/tickets/pop-ins-avis.md, AV2) a fuite dans le build release."
            exit 1
          fi
          echo "Bundle release : aucune trace du diagnostic ni du fournisseur App Check de debug ($dex_count fichier(s) dex inspecte(s))."
          # The activity of the review window's library (src/release/AndroidManifest.xml removes it) must not be declared in the release manifest.
          if unzip -p "$bundle" base/manifest/AndroidManifest.xml | grep -a -c 'PlayCoreDialogWrapperActivity' | grep -q -v '^0$'; then
            echo "::error title=Activite de la fenetre d'avis dans le release::Le manifeste du bundle release declare PlayCoreDialogWrapperActivity (bibliotheque d'avis du store) : verifier android/app/src/release/AndroidManifest.xml."
            exit 1
          fi
          # The launch-duration readout is for the debug and releaseLike builds only: the real release must not contain it.
          if unzip -p "$bundle" 'base/dex/*.dex' | grep -a -c 'STARTUPMETRICSOVERLAY' | grep -q -v '^0$'; then
            echo "::error title=Mesure du demarrage dans le release::Le bundle release contient l'affichage de mesure du demarrage (STARTUPMETRICSOVERLAY) : il doit rester reserve aux builds debug et releaseLike."
            exit 1
          fi
          # releaseLike is built from the release sources: same proof for its APK.
          like=app/build/outputs/apk/releaseLike/app-releaseLike.apk
          test -f "$like" || { echo "::error::APK releaseLike introuvable : $like"; exit 1; }
          if unzip -p "$like" 'classes*.dex' | grep -a -c -E 'DIAGNOSTICPROBE|DebugAppCheck|DEBUGAPPCHECKOFF|DETECTIONJOURNAL|REVIEWPROMPTPROBE|DIAGNOSTICHOLDGESTURE' | grep -q -v '^0$'; then
            echo "::error title=Code de debug dans releaseLike::L'APK releaseLike contient le diagnostic, le fournisseur App Check de debug, l'interrupteur « sans App Check » (AC-4), le journal de detection ou la fenetre d'avis (REVIEWPROMPTPROBE) ou le geste secret d'appui de 10 s vers le diagnostic (DIAGNOSTICHOLDGESTURE)."
            exit 1
          fi
          echo "APK releaseLike : aucune trace du diagnostic ni du fournisseur App Check de debug."

      # AV2 (docs/tickets/pop-ins-avis.md): a release build must REFUSE the review window flag unless -Pmiff.allowReviewPromptInRelease=true is given too. The build is
      # expected to FAIL (at preReleaseBuild, before anything is compiled), and to say why.
      - name: Check that a release build refuses the review window flag
        run: |
          log="$RUNNER_TEMP/review-guard.log"
          if ./gradlew bundleRelease -Pmiff.reviewPrompt=true --console=plain -Pmiff.uploadCrashlyticsMapping=false > "$log" 2>&1; then
            echo "::error title=Garde de la fenetre d'avis absente::bundleRelease avec -Pmiff.reviewPrompt=true a REUSSI : un build de release ne doit pas accepter ce drapeau sans -Pmiff.allowReviewPromptInRelease=true."
            exit 1
          fi
          if ! grep -c 'not allowed in a release build' "$log" | grep -q -v '^0$'; then
            echo "::error title=Mauvaise raison d'echec::bundleRelease avec -Pmiff.reviewPrompt=true a echoue, mais pas par la garde de la fenetre d'avis. Voir $log."
            tail -30 "$log"
            exit 1
          fi
          echo "Garde verifiee : un build de release refuse -Pmiff.reviewPrompt=true."

      # Release preparation: the signature of the release comes from ENVIRONMENT VARIABLES ONLY (build.gradle.kts, section "UPLOAD KEY"). Proof with a THROW-AWAY
      # key made on this disposable runner (random password, valid 2 days, never a real key, deleted with the runner): (1) all four variables: the release
      # variant uses the "release" signing config, and the debug and releaseLike variants keep the debug one; (2) only some of them: the build FAILS (a half
      # configured signature must never produce an unsigned bundle without a word); (3) all four but no -Pmiff.versionCode: a signed release is refused (Google
      # Play needs a code that grows). With none of them the release stays unsigned: that is the bundle built above. Nothing here is a secret.
      - name: Check the wiring of the release signature (throw-away key, nothing real)
        run: |
          set +x
          tmp="$RUNNER_TEMP/throwaway"
          mkdir -p "$tmp"
          export MIFF_UPLOAD_STORE_PASSWORD="$(openssl rand -hex 16)"
          export MIFF_UPLOAD_KEY_PASSWORD="$MIFF_UPLOAD_STORE_PASSWORD"
          export MIFF_UPLOAD_KEY_ALIAS=throwaway
          export MIFF_UPLOAD_STORE_FILE="$tmp/throwaway.jks"
          keytool -genkeypair -keystore "$MIFF_UPLOAD_STORE_FILE" -alias throwaway -storepass:env MIFF_UPLOAD_STORE_PASSWORD -keypass:env MIFF_UPLOAD_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Miff CI throw-away" > /dev/null
          common="--console=plain --no-configuration-cache -Pmiff.uploadCrashlyticsMapping=false"
          report="$RUNNER_TEMP/signing-report.txt"
          ./gradlew :app:signingReport $common > "$report" 2>&1 || { tail -30 "$report"; echo "::error title=Signature de release::signingReport a echoue avec les quatre variables MIFF_UPLOAD_*."; exit 1; }
          config_of() { awk -v variant="Variant: $1" '$0 == variant { found = 1 } found && /^Config:/ { print $2; exit }' "$report"; }
          if [ "$(config_of release)" != "release" ]; then
            echo "::error title=Signature de release::La variante release n'utilise pas la configuration de signature « release » alors que les quatre variables MIFF_UPLOAD_* sont donnees."
            exit 1
          fi
          if [ "$(config_of releaseLike)" != "debug" ] || [ "$(config_of debug)" != "debug" ]; then
            echo "::error title=Signature de release::Les variantes debug et releaseLike doivent rester signees avec la cle de debug."
            exit 1
          fi
          log="$RUNNER_TEMP/signing-guard.log"
          if env -u MIFF_UPLOAD_KEY_PASSWORD ./gradlew :app:signingReport $common > "$log" 2>&1; then
            echo "::error title=Signature a moitie configuree::Le build a reussi avec trois variables MIFF_UPLOAD_* sur quatre : il doit echouer."
            exit 1
          fi
          if ! grep -c 'half configured' "$log" | grep -q -v '^0$'; then
            echo "::error title=Mauvaise raison d'echec::Le build a echoue, mais pas par la garde de la signature a moitie configuree."
            tail -30 "$log"
            exit 1
          fi
          if ./gradlew bundleRelease $common > "$log" 2>&1; then
            echo "::error title=Garde du numero de version absente::Un bundle de release signe a ete construit sans -Pmiff.versionCode : il doit etre refuse."
            exit 1
          fi
          if ! grep -c 'explicit version code' "$log" | grep -q -v '^0$'; then
            echo "::error title=Mauvaise raison d'echec::Le bundle signe a ete refuse, mais pas par la garde du numero de version."
            tail -30 "$log"
            exit 1
          fi
          rm -rf "$tmp"
          echo "Signature verifiee : variante release signee par la cle d'envoi (cle jetable), debug et releaseLike inchangees, signature a moitie configuree refusee, numero de version obligatoire."

      # Release preparation: Google Play requires 16 KB memory pages (Android 15+) for the 64-bit native libraries (arm64-v8a, x86_64) of an app that targets
      # Android 15 or later. The ELF headers of every .so of the unsigned release bundle must align their segments on at least 16 384 bytes. The check script has
      # its own tests (hand-made ELF files); the real libraries (MapLibre, ...) are read from the bundle built above.
      - name: Native libraries aligned for 16 KB memory pages (release bundle)
        run: |
          node --test ci/check-elf-16kb.test.mjs
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -f "$bundle" || { echo "::error::Bundle release introuvable : $bundle"; exit 1; }
          work="$RUNNER_TEMP/aab-libs"
          mkdir -p "$work"
          # One ABI folder at a time: how "*" treats "/" differs between unzip builds. A missing ABI is not an error; an empty extraction is (the script refuses it).
          for abi in arm64-v8a x86_64; do
            unzip -q -o "$bundle" "base/lib/$abi/*" -d "$work" || true
          done
          node ci/check-elf-16kb.mjs "$work"

      # The release resource shrinker removed "default_web_client_id" once (it is read by name): without it "Continuer avec
      # Google" never works in a release build. Same proof for the biometric permissions pulled in by androidx.credentials.
      - name: Check the release bundle keeps the Google web client id and has no biometric permission
        if: env.FAKE_FIREBASE_CONFIG != 'true'
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          if ! unzip -p "$bundle" base/resources.pb | grep -a -c 'default_web_client_id' | grep -q -v '^0$'; then
            echo "::error title=Client web Google supprime::default_web_client_id est absent du bundle release : la connexion Google ne marcherait pas. Verifier android/app/src/main/res/raw/keep.xml."
            exit 1
          fi
          if unzip -p "$bundle" base/manifest/AndroidManifest.xml | grep -a -c -E 'USE_BIOMETRIC|USE_FINGERPRINT' | grep -q -v '^0$'; then
            echo "::error title=Permission biometrique::USE_BIOMETRIC ou USE_FINGERPRINT est revenu dans le manifeste release (voir AndroidManifest.xml et le README, section securite du manifeste)."
            exit 1
          fi
          echo "Bundle release : client web Google present, aucune permission biometrique."

      # LOC-2a: the app now DECLARES its location permissions (FINE, COARSE, BACKGROUND) and POST_NOTIFICATIONS; UPDATE-1 adds CAMERA (the viewfinder of
      # the Update screen; CameraX declares none of its own, and no storage, photo-library or microphone permission may appear). They are the ONLY sensitive
      # permissions allowed. The check reads the MERGED manifests (what the phone really gets), not the source one: a library update that merges
      # another one (another location permission, a foreground service, Wi-Fi state) is caught here. The three location permissions must be
      # present (the app does not work without them) and nothing else of that family may appear. Never skipped (also for Dependabot).
      - name: Check the sensitive permissions of the merged manifests (location, notifications)
        run: |
          allowed='android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.ACCESS_BACKGROUND_LOCATION android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.CAMERA'
          check_manifest() {
            # xargs puts the sorted names on one line (no newline character to escape in this file).
            found=$(grep -a -o -E 'android[.]permission[.](ACCESS_[A-Z_]*LOCATION[A-Z_]*|FOREGROUND_SERVICE[A-Z_]*|POST_NOTIFICATIONS|ACCESS_WIFI_STATE|NEARBY_[A-Z_]+|ACTIVITY_RECOGNITION|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|CAMERA|RECORD_AUDIO|READ_MEDIA_[A-Z_]+|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' | sort -u | xargs)
            expected=$(printf '%s ' $allowed | xargs -n1 | sort -u | xargs)
            if [ "$found" != "$expected" ]; then
              echo "::error title=Permissions sensibles::$1 declare : [$found] au lieu de : [$expected]. Une bibliotheque a ajoute une permission (la retirer avec tools:node=\"remove\" dans AndroidManifest.xml), (une alarme exacte, SCHEDULE_EXACT_ALARM ou USE_EXACT_ALARM, est interdite pour les rappels), ou une permission des tickets LOC-2a (localisation) ou UPDATE-1 (CAMERA, rien d'autre : ni stockage, ni photos, ni micro) manque."
              return 1
            fi
          }
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -f "$bundle" || { echo "::error::Bundle release introuvable : $bundle"; exit 1; }
          unzip -p "$bundle" base/manifest/AndroidManifest.xml | check_manifest "Le bundle release" || exit 1
          manifests=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml)
          test -n "$manifests" || { echo "::error::Aucun manifeste fusionne trouve."; exit 1; }
          for m in $manifests; do
            check_manifest "$m" < "$m" || exit 1
          done
          echo "Manifestes fusionnes (bundle release et variantes) : exactement la localisation (precise, approximative, arriere-plan), les notifications, le redemarrage du telephone (LOC-2b) et la camera (UPDATE-1)."

      # actions/upload-artifact v7.0.2
      - name: Upload debug APK (short retention)
        if: env.FAKE_FIREBASE_CONFIG != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: miff-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload releaseLike APK (short retention)
        if: env.FAKE_FIREBASE_CONFIG != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: miff-releaselike-apk
          path: android/app/build/outputs/apk/releaseLike/app-releaseLike.apk
          retention-days: 3
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Android build"
            echo
            if [ -f "$RUNNER_TEMP/timings.md" ]; then cat "$RUNNER_TEMP/timings.md"; fi
            echo
            echo "> The debug APK artifact (kept 3 days) contains the public Firebase configuration of project miff-3d283 (google-services.json values: project and app identifiers, public API key). It is not a secret credential, but share the file only with testers."
            echo "> Release bundle is unsigned here on purpose: the SIGNED bundle for Google Play is built by the manual workflow android-release (needs the upload-key secrets, see docs/release/checklist-android.md)."
            if [ "$FAKE_FIREBASE_CONFIG" = "true" ]; then
              echo "> Dependabot run: built with an obviously fake Firebase configuration (the secret is not available to Dependabot). The APK was not published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Firebase configuration and debug keystore from the runner
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$HOME/.android/debug.keystore"

      - name: Durée du job
        if: always()
        run: echo "Durée du job build = $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"
