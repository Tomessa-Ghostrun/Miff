# Mises à jour automatiques des dépendances : chaque mise à jour arrive sous
# forme de PR et passe par la CI. Gratuit.
#
# Écosystèmes : `gradle` (Android, depuis INIT-2) et `swift` (iOS, Swift Package Manager, depuis INIT-4, quand
# ios/Package.resolved existe : une entrée pointant vers un dossier sans manifeste ferait échouer Dependabot).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "android"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"

  # iOS : Swift Package Manager (Firebase). Le projet Xcode est GÉNÉRÉ par XcodeGen et n'est pas versionné ;
  # la source de vérité des versions est ios/project.yml + ios/Package.resolved. LIMITE CONNUE, NON VÉRIFIÉE :
  # Dependabot lit surtout Package.swift / un .xcodeproj versionné ; il peut donc ne rien proposer ici. Si aucune
  # PR Dependabot « ios » n'apparaît d'ici quelques semaines, la mise à jour de Firebase se fait à la main
  # (changer exactVersion dans project.yml, le workflow `ios` fournit alors le nouveau Package.resolved).
  - package-ecosystem: "swift"
    directory: "/ios"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ios"
