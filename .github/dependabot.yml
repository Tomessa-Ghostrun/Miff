# Mises à jour automatiques des dépendances : chaque mise à jour arrive sous
# forme de PR et passe par la CI. Gratuit.
#
# L'écosystème `gradle` (Android) est déclaré depuis INIT-2. `swift` (iOS, Swift Package Manager) reste à ajouter
# dans INIT-4, quand un manifeste (Package.swift / Package.resolved) existera : une entrée pointant vers un
# dossier vide ferait échouer Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "android"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
