<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miff</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta name="color-scheme" content="light">
<meta name="miff-api-key" content="{{apiKey}}">
<meta name="miff-api-base" content="{{apiBase}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
<script type="module" src="/assets/reset-password.js"></script>
</head>
<body class="page-reset">
<a class="skip-link" href="#main" data-i18n="skip">Aller au contenu / Skip to content</a>
<header class="site-header">
<div class="site-header-inner">
<span class="brand">Miff</span>
</div>
</header>
<main id="main" tabindex="-1">
<noscript>
<div class="card">
<p lang="fr">Cette page a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, puis rouvre le lien reçu par e-mail.</p>
<p lang="en">This page needs JavaScript to work. Turn it on in your browser, then open the link from your e-mail again.</p>
</div>
</noscript>

<p class="status" data-state="checking" role="status" hidden><span data-i18n="checking"></span></p>

<section class="card" data-state="form" hidden>
<h1 class="state-title" tabindex="-1" data-i18n="formTitle"></h1>
<p data-i18n="formIntro"></p>
<form id="reset-form" method="post" novalidate>
<div class="field">
<label for="new-password" data-i18n="newPasswordLabel"></label>
<div class="field-row">
<input id="new-password" name="new-password" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="new-password-hint new-password-error">
<button type="button" class="toggle" id="toggle-new" data-i18n-label="showNewPassword" data-i18n="show"></button>
</div>
<p class="hint" id="new-password-hint" data-i18n="newPasswordHint"></p>
<p class="field-error" id="new-password-error" role="alert"></p>
</div>
<div class="field">
<label for="confirm-password" data-i18n="confirmPasswordLabel"></label>
<div class="field-row">
<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="confirm-password-error">
<button type="button" class="toggle" id="toggle-confirm" data-i18n-label="showConfirmPassword" data-i18n="show"></button>
</div>
<p class="field-error" id="confirm-password-error" role="alert"></p>
</div>
<p class="form-error" id="form-error" role="alert"></p>
<button type="submit" class="button-primary" id="submit" disabled data-i18n="submit"></button>
</form>
</section>

<section class="card" data-state="invalid" hidden>
<h1 class="state-title" tabindex="-1" data-i18n="invalidTitle"></h1>
<p data-i18n="invalidBody"></p>
</section>

<section class="card" data-state="problem" hidden>
<h1 class="state-title" tabindex="-1" data-i18n="problemTitle"></h1>
<p data-i18n="problemBody"></p>
<button type="button" class="button-primary" id="retry" data-i18n="retry"></button>
</section>

<section class="card" data-state="success" hidden>
<h1 class="state-title" tabindex="-1" data-i18n="successTitle"></h1>
<p data-i18n="successBody"></p>
</section>
</main>
</body>
</html>
