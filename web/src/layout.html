<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow">
<meta name="referrer" content="strict-origin">
<meta name="color-scheme" content="light">
{{alternates}}<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
{{social}}<link rel="stylesheet" href="/assets/site.css">
{{extraStyles}}</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">{{skip}}</a>
<header class="site-header">
<div class="site-header-inner">
<a class="brand" href="{{homeUrl}}"><img class="brand-logo" src="/assets/logo/miff-wordmark-color.svg" alt="Miff" width="93" height="36"></a>
<p class="lang-switch"><a href="{{otherUrl}}" hreflang="{{otherLang}}" lang="{{otherLang}}"><svg class="lang-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9Z"/></svg>{{otherLabel}}</a></p>
<nav class="site-nav" aria-label="{{navLabel}}">
<ul>
{{nav}}
</ul>
</nav>
</div>
</header>
<main id="main" tabindex="-1">
{{content}}
</main>
<footer class="site-footer">
<div class="site-footer-inner">
<p>{{footer}}</p>
<p>{{publisher}}</p>
<p>{{fontsNote}}</p>
</div>
</footer>
</body>
</html>
