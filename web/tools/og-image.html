<!doctype html>
<!--
  Gabarit de l'image de partage (Open Graph / Twitter), 1200 x 630 px. Outil de développement : non publié.
  Rendu par web/tools/make-landing-images.mjs (adresse : /web/tools/og-image.html?lang=fr ou ?lang=en).
  Reprend le logo officiel (design/assets/logo/master), les polices et les couleurs du design system.
  Montre la bulle « Tout va bien » et deux cartes de statut du Feed (comme la maquette de l'accueil) : Miff n'envoie
  aucune notification d'arrivée ni de départ, il ne faut donc jamais représenter de telles notifications ici.
  Les photos sont celles du carrousel de bienvenue (licence Pexels, voir design/exports/onboarding-photos/CREDITS.md).
-->
<html>
<head>
<meta charset="utf-8">
<title>Miff - image de partage</title>
<style>
@font-face { font-family: "Baloo Thambi 2"; src: url("/android/app/src/main/res/font/baloo_thambi_2.ttf"); font-weight: 400 800; }
@font-face { font-family: "Hanken Grotesk"; src: url("/android/app/src/main/res/font/hanken_grotesk.ttf"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  font-family: "Hanken Grotesk", sans-serif;
  color: #222222;
  background: linear-gradient(180deg, #f9f9f7 17%, #edefb9 100%);
}
.blob { position: absolute; border-radius: 50%; background: #d1d828; opacity: 0.22; }
.blob-a { width: 760px; height: 600px; right: -140px; top: -120px; border-radius: 58% 42% 55% 45% / 50% 60% 40% 50%; }
.blob-b { width: 520px; height: 420px; left: -180px; bottom: -200px; border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%; opacity: 0.16; }
.logo { position: absolute; left: 72px; top: 64px; width: 232px; height: 90px; }
.pill {
  position: absolute; left: 72px; top: 188px;
  display: inline-block; padding: 8px 20px; border-radius: 999px;
  background: #ffffff; border: 2px solid #043cd1; color: #043cd1;
  font-weight: 700; font-size: 24px;
}
h1 {
  position: absolute; left: 72px; top: 252px; width: 620px;
  font-family: "Baloo Thambi 2", sans-serif; font-weight: 800;
  font-size: 64px; line-height: 1.08; color: #222222;
}
html[lang="en"] h1 { font-size: 56px; }
h1 em { font-style: normal; color: #043cd1; }
.lead {
  position: absolute; left: 72px; top: 506px; width: 600px;
  font-size: 26px; line-height: 1.3; color: #4b4b4a;
}
.banner {
  position: absolute; right: 52px; top: 70px; width: 440px; height: 168px;
  padding: 34px 40px 0; border-radius: 55% 45% 50% 50% / 55% 50% 50% 45%;
  background: rgba(209, 216, 40, 0.42);
}
.banner b { display: block; font-family: "Baloo Thambi 2", sans-serif; font-weight: 800; font-size: 46px; line-height: 1.1; }
.banner span { display: block; font-size: 22px; color: #4b4b4a; margin-top: 4px; }
.banner svg { position: absolute; right: 44px; bottom: 30px; width: 40px; height: 40px; fill: #d1d828; }
.card {
  position: absolute; right: 52px; width: 440px; padding: 20px 22px 20px 20px;
  display: flex; align-items: center; gap: 20px;
  background: #ffffff; border: 1px solid #d9d9d9; border-left: 8px solid #d1d828; border-radius: 10px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
}
.card img { flex: none; width: 84px; height: 84px; border-radius: 50%; border: 4px solid #d1d828; object-fit: cover; }
.card b { display: block; font-family: "Baloo Thambi 2", sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; }
.card .badge { display: inline-block; margin-top: 6px; padding: 2px 14px; border-radius: 8px; background: rgba(209, 216, 40, 0.42); font-size: 22px; }
.card .since { display: block; margin-top: 8px; font-size: 20px; color: #4b4b4a; }
.card-1 { top: 256px; }
.card-2 { top: 432px; }
</style>
</head>
<body>
<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<img class="logo" src="/design/assets/logo/master/miff-wordmark-color.svg" alt="">
<span class="pill" id="pill"></span>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="banner"><b id="bt"></b><span id="bs"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg></div>
<div class="card card-1"><img src="/web/src/assets/img/avatar-amandine.webp" alt=""><div><b id="n1"></b><span class="badge" id="b1"></span><span class="since" id="s1"></span></div></div>
<div class="card card-2"><img src="/web/src/assets/img/avatar-thomas.webp" alt=""><div><b id="n2"></b><span class="badge" id="b2"></span><span class="since" id="s2"></span></div></div>
<script>
// Textes repris de web/src/landing.json (maquette de l'accueil).
const texts = {
  fr: {
    pill: 'Bientôt sur iPhone et Android',
    title: 'Savoir que tes proches vont bien, <em>sans les déranger.</em>',
    lead: 'Miff montre à ton cercle que tu vas bien, sans message à écrire.',
    banner: ['Tout va bien', 'Dernière nouvelle il y a 2 min'],
    c1: ['Amandine', 'À l’école', 'Depuis 8 min'],
    c2: ['Thomas', 'À la maison', 'Depuis 12 min'],
  },
  en: {
    pill: 'Coming soon on iPhone and Android',
    title: 'Know your loved ones are okay, <em>without bothering them.</em>',
    lead: 'Miff shows your circle that you are okay, with no message to write.',
    banner: ['All good', 'Latest news 2 min ago'],
    c1: ['Amandine', 'At school', 'For 8 min'],
    c2: ['Thomas', 'At home', 'For 12 min'],
  },
};
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
const t = texts[lang];
document.documentElement.lang = lang;
const set = (id, value) => { document.getElementById(id).textContent = value; };
set('pill', t.pill);
document.getElementById('title').innerHTML = t.title;
set('lead', t.lead);
set('bt', t.banner[0]);
set('bs', t.banner[1]);
[['1', t.c1], ['2', t.c2]].forEach(([i, [name, badge, since]]) => {
  set(`n${i}`, name);
  set(`b${i}`, badge);
  set(`s${i}`, since);
});
</script>
</body>
</html>
