# Description du projet Xcode de Miff, pour XcodeGen (licence MIT).
# Le fichier Miff.xcodeproj n'est PAS versionne : il est genere par la CI
# (et par `xcodegen generate` sur un Mac) a partir de ce fichier.
# Spike INIT-3 : application minimale sans Firebase ni dependance externe.
name: Miff

options:
  bundleIdPrefix: com.tomessa
  developmentLanguage: fr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Trois configurations :
#   Debug    - developpement et tests sur simulateur (CI `ios`)
#   Internal - build TestFlight du PM (CI `ios-testflight`), optimise
#   Release  - futur build public (jamais utilise dans le spike)
configs:
  Debug: debug
  Internal: release
  Release: release

settings:
  base:
    # Mode de langage Swift 5 : evite les erreurs de concurrence strictes de Swift 6
    # pour un spike. A reevaluer dans INIT-4.
    SWIFT_VERSION: "5.0"
    # Version affichee. Le numero de build est ecrase par la CI avec le numero
    # d'execution du workflow (CURRENT_PROJECT_VERSION=... sur la ligne xcodebuild).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone uniquement pour le spike (decision a confirmer, voir ios/README.md).
    TARGETED_DEVICE_FAMILY: "1"
    # L'equipe de signature n'est jamais ecrite ici : la CI la fournit (secret APPLE_TEAM_ID).
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL

targets:
  Miff:
    type: application
    platform: iOS
    sources:
      # Inclut le catalogue d'actifs (icone) et PrivacyInfo.xcprivacy (copie dans l'app).
      - path: Miff
    # Info.plist genere par XcodeGen (fichier non versionne, voir ios/.gitignore).
    # Volontairement ABSENTS : toute cle NSLocation*, NSAppTransportSecurity (ATS),
    # et ITSAppUsesNonExemptEncryption (le PM repond a la question dans App Store Connect).
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Miff
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Apparence claire imposee (pas de mode sombre dans les maquettes).
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomessa.miff
        PRODUCT_NAME: Miff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MiffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiffTests
    dependencies:
      - target: Miff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomessa.miff.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Miff:
    build:
      targets:
        Miff: all
        MiffTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiffTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Internal
